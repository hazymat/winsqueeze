name: squeezelite
# Builds vendor/squeezelite/src (upstream Squeezelite plus WinSqueeze's visualiser export) into squeezelite-ffmpeg-x64.exe.
# The exe is uploaded as an artifact; it is committed to vendor/squeezelite once checked, so app builds never depend on this.
on:
  workflow_dispatch:
  pull_request: # build and smoke test only; nothing is committed
    paths: ['vendor/squeezelite/src/**', 'vendor/squeezelite/CMakeLists.txt', 'vendor/squeezelite/vcpkg.json', '.github/workflows/squeezelite.yml']
  push:
    branches: [main]
    paths: ['vendor/squeezelite/src/**', 'vendor/squeezelite/CMakeLists.txt', 'vendor/squeezelite/vcpkg.json', '.github/workflows/squeezelite.yml']
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_COMMIT: 9eec002df1cd109f8f104cd966a763daf9751489
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4
      - name: Restore built libraries
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vendor/squeezelite/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vendor/squeezelite/vcpkg.json') }}-
            vcpkg-${{ env.VCPKG_COMMIT }}-
      - name: Get vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vcpkg-cache | Out-Null
          git clone -q https://github.com/microsoft/vcpkg.git vcpkg-tool
          git -C vcpkg-tool checkout -q $env:VCPKG_COMMIT
          .\vcpkg-tool\bootstrap-vcpkg.bat -disableMetrics
      - name: Configure
        run: cmake -S vendor/squeezelite -B build -A x64 -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg-tool/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static
      # Saved even if the app build fails, so the slow library builds (FFmpeg etc.) only ever happen once
      - name: Save built libraries
        if: always()
        uses: actions/cache/save@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vendor/squeezelite/vcpkg.json') }}-${{ github.run_id }}
      - name: Build
        run: cmake --build build --config Release
      - name: Smoke test
        shell: pwsh
        run: |
          $exe = "build/Release/squeezelite-ffmpeg-x64.exe"
          & $exe -? ; & $exe -l
          $help = & $exe -? | Out-String
          if (-not ($help -match "VISEXPORT")) { throw "visualiser export missing from build" }
          if (-not ($help -match "-F ")) { throw "fixed-volume option missing from build" }
          if (-not ($help -match "WINEQ")) { throw "graphic equaliser missing from build" }
          if (-not ($help -match "WINREC")) { throw "recorder missing from build" }
          (Get-FileHash $exe -Algorithm SHA256).Hash
      - uses: actions/upload-artifact@v4
        with:
          name: squeezelite-ffmpeg-x64
          path: build/Release/squeezelite-ffmpeg-x64.exe
      # The app bundles the committed exe; committing it here and starting an app build ships it as the next dev release
      - name: Commit the exe into vendor/squeezelite
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item build/Release/squeezelite-ffmpeg-x64.exe vendor/squeezelite/ -Force
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/squeezelite/squeezelite-ffmpeg-x64.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { git commit -m "Squeezelite: rebuilt from vendor/squeezelite/src"; git pull --rebase origin main; git push origin HEAD:main; gh workflow run build.yml --ref main }
      - name: Failed vcpkg logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs
          path: vcpkg-tool/buildtrees/**/*.log
