# One-off: rewrites dev release notes that fell back to raw commit text while a stale draft release hid the previous tag (6-9 Nov), and deletes that draft. Remove after it has run.
name: tidy-releases
on: workflow_dispatch
permissions: { contents: write }
jobs:
  tidy:
    runs-on: ubuntu-latest
    env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Rewrite notes and delete the stale draft
        shell: python
        run: |
          import json, os, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          pages = subprocess.check_output(['gh','api','--paginate',f'repos/{repo}/releases?per_page=100','--jq','.[]'], text=True)
          releases = [json.loads(line) for line in pages.splitlines() if line.strip()]
          for draft in [release for release in releases if release['draft']]:
            subprocess.run(['gh','api','-X','DELETE',f"repos/{repo}/releases/{draft['id']}"], check=True); print('deleted draft', draft['tag_name'])
          releases = sorted([release for release in releases if not release['draft']], key=lambda release: release['created_at'])
          codes = sorted(name[:-5] for name in os.listdir('locales') if name.endswith('.json') and name != 'en.json')
          def changes(previous_tag, tag, code=None):
            trailer = f'%(trailers:key=Notes-{code},valueonly,separator=)%x1f' if code else ''
            raw = subprocess.check_output(['git','log',f'{previous_tag}..{tag}','--no-merges','--perl-regexp','--author=^((?!github-actions).)*$','--invert-grep','--grep=^Notes for the .* release',f'--pretty=%(trailers:key=Impact,valueonly,separator=)%x1f{trailer}%s'], text=True)
            return [line.split('\x1f') for line in raw.split('\n') if line and '[skip ci]' not in line]
          def mark(impact): impact = impact.strip(); return '★ ' if impact.startswith('feature') else '▲ ' if impact.startswith('improvement') else ''
          for index, release in enumerate(releases):
            if index == 0 or not release['prerelease'] or (release['body'] or '').startswith('- ') or release['created_at'] < '2026-11-06T23:00:00Z': continue
            previous_tag = releases[index - 1]['tag_name']; tag = release['tag_name']
            lines = changes(previous_tag, tag)
            if not lines: continue
            notes = ['- ' + mark(parts[0]) + parts[1] for parts in lines]
            for code in codes:
              translated = changes(previous_tag, tag, code)
              if any(parts[1].strip() for parts in translated): notes += ['', f'<!-- notes:{code}'] + ['- ' + mark(parts[0]) + (parts[1].strip() or parts[2]) for parts in translated] + ['-->']
            subprocess.run(['gh','api','-X','PATCH',f"repos/{repo}/releases/{release['id']}",'-f','body=' + '\n'.join(notes) + '\n','--jq','.tag_name'], check=True)
