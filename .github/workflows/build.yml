name: build
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: npm ci
        working-directory: ui
      - run: npm run check && npm run build
        working-directory: ui
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet publish app/WinSqueeze.csproj -c Release -o publish/WinSqueeze
      - name: Add VC++ runtime for Squeezelite
        shell: pwsh
        run: Copy-Item "$env:SystemRoot\System32\vcruntime140.dll" publish/WinSqueeze/squeezelite/
      - uses: actions/upload-artifact@v4
        with: { name: WinSqueeze-win-x64, path: publish/WinSqueeze }
