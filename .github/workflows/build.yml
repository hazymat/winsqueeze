name: build
on:
  push:
    branches: [main]
    tags: ['v*']
    # Squeezelite's own sources build in squeezelite.yml; only the resulting exe (committed) changes the app
    paths-ignore: ['vendor/squeezelite/src/**', 'vendor/squeezelite/CMakeLists.txt', 'vendor/squeezelite/vcpkg.json', '.github/workflows/squeezelite.yml']
  pull_request:
  workflow_dispatch:
    inputs:
      stable_version: { description: 'Publish a stable release with this version (e.g. 1.0.0); empty = dev build', required: false, default: '' }
permissions:
  contents: write
  discussions: write
jobs:
  windows:
    runs-on: windows-latest
    env:
      REPO_URL: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # full history, for release notes since the previous release
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: npm ci
        working-directory: ui
      - run: npm run check && npm run build
        working-directory: ui
      - name: Translations (lists UI text with no German yet; see AGENTS.md)
        run: node tools/locales.mjs
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: Version and channel
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tags vX.Y.Z are stable releases; every push to main is a dev build numbered just above the latest stable (1.0.0 -> 1.1.<run>), so dev is always ahead
          if ("${{ github.ref_type }}" -eq "tag") { $version = "${{ github.ref_name }}".TrimStart("v"); $channel = "stable" }
          elseif ("${{ inputs.stable_version }}" -match '^\d+\.\d+\.\d+$') { $version = "${{ inputs.stable_version }}"; $channel = "stable" } # run by hand: stable release from main
          else {
            $stableTag = gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>$null; $global:LASTEXITCODE = 0
            $stable = $null; if ("$stableTag" -match '^v(\d+\.\d+\.\d+)$') { $stable = [version]$Matches[1] } # 404 (no stable yet) prints an error body, not a tag
            $version = if ($stable) { "$($stable.Major).$($stable.Minor + 1).${{ github.run_number }}" } else { "0.1.${{ github.run_number }}" }; $channel = "dev"
          }
          "version=$version" >> $env:GITHUB_OUTPUT; "channel=$channel" >> $env:GITHUB_OUTPUT
      - name: Add VC++ runtime for Squeezelite
        shell: pwsh
        run: Copy-Item "$env:SystemRoot\System32\vcruntime140.dll" vendor/squeezelite/
      - name: Publish installer build and single-file portable exe
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          dotnet publish app/WinSqueeze.csproj -c Release -o publish/WinSqueeze -p:Version=$version
          dotnet publish app/WinSqueeze.csproj -c Release -o publish/portable -p:Version=$version -p:WinSqueezePortable=true -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true
          New-Item -ItemType Directory -Force downloads | Out-Null
          Copy-Item publish/portable/WinSqueeze.exe downloads/WinSqueeze-Portable.exe
      - uses: actions/upload-artifact@v4
        with: { name: WinSqueeze-Portable, path: downloads/WinSqueeze-Portable.exe }
      - name: Package and publish release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"; $channel = "${{ steps.version.outputs.channel }}"
          dotnet tool install -g vpk --version 0.0.1298
          vpk download github --repoUrl $env:REPO_URL --channel $channel --token $env:GH_TOKEN -o releases  # previous release, for delta updates
          $global:LASTEXITCODE = 0
          # Notes (worked out before packing, so the release is born with them): every change since the previous release (one line each, written for users), skipping the bot's player builds
          $previousTag = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=5" --jq ('[.[] | select(.draft | not) | select(.tag_name != "v' + $version + '")][0].tag_name') # a stale draft (a failed upload) has no tag to count from
          $previousSha = if ($previousTag) { gh api "repos/$env:GITHUB_REPOSITORY/commits/$previousTag" --jq .sha } else { "" }
          # A commit's "Impact: feature" or "Impact: improvement" trailer marks its line with ★ or ▲, so What's new lists the biggest changes first
          $notes = if ($previousSha) { git log "$previousSha..HEAD" --no-merges --perl-regexp --author='^((?!github-actions).)*$' --invert-grep --grep='^Notes for the .* release' --pretty="%(trailers:key=Impact,valueonly,separator=)%x1f%s" | ForEach-Object { $parts = $_ -split [char]0x1f, 2; $mark = switch -regex ($parts[0].Trim()) { '^feature' { [char]0x2605 + ' ' } '^improvement' { [char]0x25B2 + ' ' } default { '' } }; "- $mark$($parts[1])" } } else { "" }
          if (-not $notes) { $notes = git log -1 --pretty=%B }
          # A stable release takes its written summary from docs/releases/<version>.md when there is one
          if ($channel -eq "stable" -and (Test-Path "docs/releases/$version.md")) { $notes = Get-Content "docs/releases/$version.md" }
          $global:LASTEXITCODE = 0
          ($notes -replace '&', '&amp;' -replace '<', '&lt;') | Out-File notes-vpk.txt -Encoding utf8 # Velopack parses the notes as XML
          # Translations ride along as hidden blocks the app picks by language (GitHub shows only the English): a stable release's from docs/releases/<version>.<code>.md, a dev build's from its commits' "Notes-<code>:" trailers (English where a commit has none)
          try {
            foreach ($code in (Get-ChildItem locales -Filter *.json | ForEach-Object { $_.BaseName })) {
              $translated = $null
              if ($channel -eq "stable" -and (Test-Path "docs/releases/$version.$code.md")) { $translated = Get-Content "docs/releases/$version.$code.md" -Encoding utf8 }
              elseif ($channel -eq "dev" -and $previousSha) {
                $lines = @(git log "$previousSha..HEAD" --no-merges --perl-regexp --author='^((?!github-actions).)*$' --invert-grep --grep='^Notes for the .* release' --pretty="%(trailers:key=Impact,valueonly,separator=)%x1f%(trailers:key=Notes-$code,valueonly,separator=)%x1f%s")
                if ($lines -match ([string][char]0x1f + '[^' + [char]0x1f + ']+' + [char]0x1f)) { $translated = $lines | ForEach-Object { $parts = $_ -split [char]0x1f, 3; $mark = switch -regex ($parts[0].Trim()) { '^feature' { [char]0x2605 + ' ' } '^improvement' { [char]0x25B2 + ' ' } default { '' } }; $text = if ($parts[1].Trim()) { $parts[1].Trim() } else { $parts[2] }; "- $mark$text" } }
              }
              if ($translated) { $notes = @($notes) + @("", "<!-- notes:$code") + @($translated) + @("-->") }
            }
          } catch { Write-Host "Translated notes skipped: $_" }
          $global:LASTEXITCODE = 0
          $notes | Out-File notes.txt -Encoding utf8
          vpk pack --packId WinSqueeze --packVersion $version --packDir publish/WinSqueeze --mainExe WinSqueeze.exe --packTitle WinSqueeze --icon app/Assets/WinSqueeze.ico --channel $channel --releaseNotes notes-vpk.txt -o releases
          $preFlag = @(); if ($channel -eq "dev") { $preFlag = @("--pre") }
          $title = if ($channel -eq "dev") { "WinSqueeze $version (dev)" } else { "WinSqueeze $version" }
          gh release view "v$version" --json tagName 2>$null | Out-Null; $releaseExists = $LASTEXITCODE -eq 0; $global:LASTEXITCODE = 0
          if ($releaseExists -and $channel -eq "stable") {
            # Promoting an existing dev build: add the stable feed beside the dev one (file names carry the channel) and make it a normal release
            $feedFiles = @("releases/releases.stable.json") + (Get-ChildItem releases -Filter "WinSqueeze-$version-stable-*.nupkg" | ForEach-Object { $_.FullName })
            gh release upload "v$version" @feedFiles --clobber
            gh release edit "v$version" --prerelease=false --latest --title $title
          } else { vpk upload github --repoUrl $env:REPO_URL --channel $channel --token $env:GH_TOKEN -o releases --publish --tag "v$version" --releaseName $title @preFlag }
          if ($LASTEXITCODE -ne 0) { throw "Publishing the release failed" }
          Copy-Item (Get-ChildItem releases -Filter *Setup.exe | Select-Object -First 1).FullName downloads/WinSqueeze-Setup.exe
          gh release upload "v$version" downloads/WinSqueeze-Portable.exe downloads/WinSqueeze-Setup.exe --clobber
          # Keep just the two downloads plus the updater's own feed files
          foreach ($duplicate in (Get-ChildItem releases | Where-Object { ($_.Name -like "*-Setup.exe" -or $_.Name -like "*-Portable.zip") -and $_.Name -ne "WinSqueeze-Setup.exe" })) { gh release delete-asset "v$version" $duplicate.Name --yes }
          gh release edit "v$version" --notes-file notes.txt
          # One discussion per release for comments (needs Discussions enabled)
          gh release edit "v$version" --discussion-category "Announcements"
          if ($LASTEXITCODE -ne 0) { Write-Host "Discussions not enabled yet; skipped"; $global:LASTEXITCODE = 0 }
